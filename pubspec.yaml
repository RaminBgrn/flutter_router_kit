name: flutter_router_kit
description: A ready-made kit for setting up go_router with a fixed AppBar/BottomNav shell, nested routes, and GetX Bindings support.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.0.0
  get: ^4.6.6

dev_dependencies:
  flutter_test:
    sdk: flutter
